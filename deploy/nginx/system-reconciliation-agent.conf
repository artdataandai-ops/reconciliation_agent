# ============================================================================
# SYSTEM (edge) nginx — paste into the server { listen 7777 ssl ...; } block on
# ai.arttechgroup.com.  Public API base:  https://ai.arttechgroup.com:7777/reconciliation-agent/api
#
# This is NOT the bundled reconciliation.conf (that one runs inside the Docker stack and
# serves /api/ at the container root). This edge block strips the public
# /reconciliation-agent/ prefix and forwards to the bundled nginx, host-bound at
# 127.0.0.1:4775 (see docker-compose.yml).
#
#   Browser ──https──► edge nginx :7777 ──/reconciliation-agent/──► 127.0.0.1:4775 ──► backend:8000
#           (TLS here)                     (prefix stripped here)     (bundled nginx)   (uvicorn)
#
# After editing the edge config:  sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# Redirect the bare prefix to the trailing-slash form.
location = /reconciliation-agent { return 301 /reconciliation-agent/; }

location /reconciliation-agent/ {
    # Strip the /reconciliation-agent/ prefix; the bundled nginx serves /api/ and / at its root.
    rewrite ^/reconciliation-agent/(.*) /$1 break;

    proxy_pass http://127.0.0.1:4775;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 10M;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
