services:
  backend:
    build:
      # Repo root context so the image can include gen_unrecon_day.py (main.py resolves it at ../).
      context: .
      dockerfile: backend/Dockerfile
    container_name: reconciliation-backend
    restart: unless-stopped
    env_file:
      # Holds LYZR_API_KEY / LYZR_AGENT_ID (gitignored, never baked into the image).
      - ./backend/.env
    environment:
      # Container-local dataset path (overrides the Windows default from .env).
      DATA_DIR: /app/data
      # Regenerate the synthetic dataset for "today" on startup (dates move, numbers fixed).
      AUTO_REGEN: "1"
      # Allow the deployed Cloudflare Pages frontend to call the API cross-origin.
      CORS_ALLOWED_ORIGINS: https://reconciliation-agent-arttechgroup.pages.dev
    volumes:
      - ./data:/app/data        # generated dataset (survives rebuilds; inspectable)
    networks:
      - recon-net

  nginx:
    image: nginx:1.27-alpine
    container_name: reconciliation-nginx
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./deploy/nginx/reconciliation.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Host-bound only; the system (edge) nginx on :7777 forwards /reconciliation-agent/ here.
      - "127.0.0.1:4775:80"
    networks:
      - recon-net

networks:
  recon-net:
    driver: bridge
