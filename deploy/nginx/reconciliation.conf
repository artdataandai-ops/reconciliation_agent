# Bundled nginx for the Reconciliation Agent Docker stack.
# Listens on :80 internally, host-bound at 127.0.0.1:4775 (see docker-compose.yml).
# The system (edge) nginx forwards /reconciliation-agent/* here with the prefix stripped,
# so this config serves the app's native paths (/api/*, / for health) at its own root.

upstream recon_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # FastAPI JSON API: /api/files, /api/file/{name}/preview, /api/reconcile
    location /api/ {
        proxy_pass http://recon_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;     # /api/reconcile calls the Lyzr agent (can be slow)
        proxy_send_timeout 120s;
    }

    # Health endpoint is the app root "/" (returns {"ok": true, ...}).
    location = / {
        proxy_pass http://recon_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # No static frontend here (it's on Cloudflare Pages) — anything else is 404.
    location / {
        return 404;
    }
}
